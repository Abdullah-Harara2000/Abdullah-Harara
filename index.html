<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدودة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐛 لعبة الدودة 🐛</h1>
        <div class="game-info">
            <div class="score">
                <span>النقاط: </span>
                <span id="score">0</span>
            </div>
            <div class="high-score">
                <span>أعلى نقاط: </span>
                <span id="highScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>استخدم أزرار الأسهم للتحكم بالدودة</p>
            <button id="startBtn" class="btn">ابدأ اللعبة</button>
            <button id="pauseBtn" class="btn" disabled>إيقاف مؤقت</button>
        </div>
        <div class="instructions">
            <h3>التعليمات:</h3>
            <ul>
                <li>استخدم أزرار الأسهم لتحريك الدودة</li>
                <li>اجمع الطعام (🍎) لتكبر الدودة وتزيد النقاط</li>
                <li>لا تصطدم بالجدران أو بنفسك!</li>
                <li>حاول الحصول على أعلى النقاط</li>
            </ul>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
